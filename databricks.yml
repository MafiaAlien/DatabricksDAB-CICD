# This is a Declarative Automation Bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_project
  uuid: 37bace9c-131a-4a79-a799-6a5c5dd13f58

include:
  - resources/*.yml

# 每次 bundle deploy 前自动构建 wheel，产物在 ./dist 下。
artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
    default: "citibike_dev"
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405618154439706.6.azuredatabricks.net
      profile: DEV
    variables:
      catalog: citibike_dev
      schema: ${workspace.current_user.short_name}
  
  test:
    # Uses 'mode: production' with a shared root_path, but keeps a per-user
    # schema so concurrent test deployments stay isolated.
    mode: production
    workspace:
      host: https://adb-7405613110999324.4.azuredatabricks.net
      profile: TEST
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    presets:
      name_prefix: '[test] '
    variables:
      catalog: citibike_test
      schema: ${workspace.current_user.short_name}
  
  prod:
    mode: production
    workspace:
      host: https://adb-7405611541544528.8.azuredatabricks.net
      profile: PROD
      # Deploy to a fixed shared path so we only ever have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: citibike_prod
      schema: prod
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    presets:
      name_prefix: '[prod] '
